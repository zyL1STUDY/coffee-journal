name: coffee_journal
description: AI-powered coffee journal for recording coffee moments.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_dotenv: ^5.2.1
  flutter_svg: ^2.2.3
  go_router: ^17.3.0
  http: ^1.6.0
  image_picker: ^1.1.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/backgrounds/
    - assets/images/home/
    - assets/images/nav/
